<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net-Pulse Stealth | Speed Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            scroll-behavior: smooth; 
            background-color: #000000; 
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Industrial Watch Gauge */
        .gauge-container {
            width: 320px;
            height: 320px;
            position: relative;
        }
        .gauge-base {
            fill: none;
            stroke: #1a1a1a;
            stroke-width: 8;
            stroke-linecap: square;
            stroke-dasharray: 254.469 339.292; 
            transform: rotate(135deg);
            transform-origin: 50% 50%;
        }
        .gauge-progress {
            fill: none;
            stroke-width: 8;
            stroke-linecap: square;
            stroke-dasharray: 0 339.292;
            transition: stroke-dasharray 0.4s cubic-bezier(0.1, 0.7, 0.1, 1);
            transform: rotate(135deg);
            transform-origin: 50% 50%;
            stroke: #ffffff; 
        }
        .needle {
            width: 2px;
            height: 115px;
            background: #e11d48; 
            position: absolute;
            left: calc(50% - 1px);
            bottom: 50%;
            transform-origin: bottom center;
            transition: transform 0.4s cubic-bezier(0.1, 0.7, 0.1, 1);
            transform: rotate(-135deg);
            z-index: 5;
            pointer-events: none;
        }
        .needle::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: -5px;
            width: 12px;
            height: 12px;
            background: #e11d48;
            border-radius: 50%;
            border: 2px solid #000000;
        }

        .tick {
            position: absolute;
            width: 1.5px;
            height: 6px;
            background: #333333;
            left: calc(50% - 0.75px);
            transform-origin: center 160px;
        }

        .glass {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
        }

        .go-btn {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #000000;
            border: 1px solid #333333;
            color: #ffffff;
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            z-index: 20;
        }
        .go-btn:hover {
            border-color: #ffffff;
            background: #ffffff;
            color: #000000;
            transform: scale(1.02);
        }
        .go-btn:active {
            transform: scale(0.96);
        }

        .summary-section {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .summary-section.visible {
            max-height: 1200px;
            opacity: 1;
            margin-top: 3rem;
            padding-bottom: 4rem;
        }

        .progress-step {
            height: 2px;
            background: #1a1a1a;
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .progress-step-fill {
            position: absolute;
            height: 100%;
            width: 0%;
            background: #ffffff;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="text-neutral-400 min-h-screen flex flex-col items-center p-6">

    <div class="max-w-xl w-full space-y-12 mt-12">
        
        <!-- Header -->
        <div class="flex justify-between items-end px-2">
            <div>
                <h1 class="text-lg font-bold text-white tracking-widest uppercase">Net-Pulse</h1>
                <p id="isp-display" class="text-[9px] font-bold text-neutral-800 uppercase tracking-[0.3em]">Ready for test</p>
            </div>
            <div class="text-right">
                <p id="location-display" class="text-[9px] font-bold text-neutral-800 uppercase tracking-widest">---</p>
                <p id="ip-display" class="text-[10px] font-mono text-neutral-800">---.---.---.---</p>
            </div>
        </div>

        <!-- Gauge Section -->
        <div class="flex justify-center relative">
            <div class="gauge-container">
                <div id="tick-container" class="absolute inset-0 pointer-events-none"></div>
                
                <svg viewBox="0 0 120 120" class="w-full h-full">
                    <circle class="gauge-base" cx="60" cy="60" r="54" />
                    <circle id="gauge-arc" class="gauge-progress" cx="60" cy="60" r="54" pathLength="339.292" />
                </svg>

                <div id="needle" class="needle"></div>

                <!-- Center UI -->
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <button id="go-btn" class="go-btn flex items-center justify-center">GO</button>
                    
                    <div id="speed-display" class="hidden flex flex-col items-center pt-12">
                        <div class="flex items-baseline gap-1">
                            <span id="main-speed" class="text-7xl font-light tracking-tighter text-white">0</span>
                            <span class="text-sm font-bold text-neutral-700">Mbps</span>
                        </div>
                        <span id="current-stage" class="text-[8px] font-black tracking-[0.6em] text-neutral-500 uppercase mt-4">Standby</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Metrics Bars -->
        <div class="grid grid-cols-2 gap-8 px-4">
            <div id="ind-dl" class="flex flex-col opacity-20 transition-all duration-500">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[9px] font-bold text-neutral-500 uppercase tracking-widest">Download</span>
                    <span class="text-[9px] font-mono text-neutral-700"><span id="val-dl" class="text-white">0.0</span> Mbps</span>
                </div>
                <div class="progress-step"><div id="fill-dl" class="progress-step-fill"></div></div>
            </div>
            <div id="ind-ul" class="flex flex-col opacity-20 transition-all duration-500">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[9px] font-bold text-neutral-500 uppercase tracking-widest">Upload</span>
                    <span class="text-[9px] font-mono text-neutral-700"><span id="val-ul" class="text-white">0.0</span> Mbps</span>
                </div>
                <div class="progress-step"><div id="fill-ul" class="progress-step-fill"></div></div>
            </div>
        </div>

        <!-- Integrated Summary -->
        <div id="summary-section" class="summary-section">
            <div class="glass rounded-xl p-8 space-y-10">
                <div class="flex justify-between items-start">
                    <h2 class="text-xl font-bold text-white tracking-tight">System Report</h2>
                    <button onclick="resetTest()" class="p-2 border border-neutral-800 hover:border-neutral-500 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-x-12 gap-y-8">
                    <div class="space-y-1">
                        <p class="text-[9px] font-bold text-neutral-600 uppercase tracking-widest">Peak Download</p>
                        <p class="text-2xl font-light text-white"><span id="sum-dl">0.0</span> <span class="text-xs text-neutral-700 uppercase">Mbps</span></p>
                    </div>
                    <div class="space-y-1">
                        <p class="text-[9px] font-bold text-neutral-600 uppercase tracking-widest">Peak Upload</p>
                        <p class="text-2xl font-light text-white"><span id="sum-ul">0.0</span> <span class="text-xs text-neutral-700 uppercase">Mbps</span></p>
                    </div>
                    <div class="space-y-1">
                        <p class="text-[9px] font-bold text-neutral-600 uppercase tracking-widest">Latency</p>
                        <p class="text-2xl font-light text-white"><span id="sum-ping">0</span> <span class="text-xs text-neutral-700 uppercase">ms</span></p>
                    </div>
                    <div class="space-y-1">
                        <p class="text-[9px] font-bold text-neutral-600 uppercase tracking-widest">Jitter</p>
                        <p class="text-2xl font-light text-white"><span id="sum-jitter">0</span> <span class="text-xs text-neutral-700 uppercase">ms</span></p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const elements = {
            goBtn: document.getElementById('go-btn'),
            speedBox: document.getElementById('speed-display'),
            mainSpeed: document.getElementById('main-speed'),
            gaugeArc: document.getElementById('gauge-arc'),
            needle: document.getElementById('needle'),
            stageText: document.getElementById('current-stage'),
            summary: document.getElementById('summary-section'),
            isp: document.getElementById('isp-display'),
            ip: document.getElementById('ip-display'),
            loc: document.getElementById('location-display'),
            indDl: document.getElementById('ind-dl'),
            indUl: document.getElementById('ind-ul'),
            valDl: document.getElementById('val-dl'),
            valUl: document.getElementById('val-ul'),
            fillDl: document.getElementById('fill-dl'),
            fillUl: document.getElementById('fill-ul'),
            sumDl: document.getElementById('sum-dl'),
            sumUl: document.getElementById('sum-ul'),
            sumPing: document.getElementById('sum-ping'),
            sumJitter: document.getElementById('sum-jitter')
        };

        const CIRCUMFERENCE = 339.292;
        const ARC_LEN = 254.469;

        // Ticks Setup
        const ticks = document.getElementById('tick-container');
        for (let i = 0; i <= 270; i += 10) {
            const div = document.createElement('div');
            div.className = 'tick';
            div.style.transform = `rotate(${i - 135}deg)`;
            if (i % 50 === 0) {
                div.style.height = '10px';
                div.style.background = '#444444';
            }
            ticks.appendChild(div);
        }

        async function initNetwork() {
            elements.isp.textContent = "DETECTING...";
            try {
                const res = await fetch('https://ipwho.is/');
                const data = await res.json();
                elements.isp.textContent = data.connection?.isp || data.isp || 'Provider Detected';
                elements.ip.textContent = data.ip;
                elements.loc.textContent = `${data.city}, ${data.country_code}`;
                elements.isp.classList.remove('text-neutral-600');
                elements.isp.classList.add('text-white');
            } catch (e) {
                elements.isp.textContent = "OFFLINE MODE";
            }
        }

        function updateGauge(speed, max = 100) {
            const percent = Math.min(speed / max, 1);
            elements.gaugeArc.style.strokeDasharray = `${percent * ARC_LEN} ${CIRCUMFERENCE}`;
            const rotate = (percent * 270) - 135;
            elements.needle.style.transform = `rotate(${rotate}deg)`;
            elements.mainSpeed.textContent = speed.toFixed(speed > 10 ? 0 : 1);
        }

        async function testLatency() {
            elements.stageText.textContent = "SYNCHRONIZING";
            let pings = [];
            for (let i = 0; i < 5; i++) {
                const start = performance.now();
                try {
                    await fetch('https://ipwho.is/', { mode: 'no-cors', cache: 'no-store' });
                    const end = performance.now();
                    pings.push(end - start);
                } catch(e) {
                    pings.push(50); // Fallback
                }
                elements.sumPing.textContent = Math.round(pings.reduce((a, b) => a + b) / pings.length);
                elements.sumJitter.textContent = Math.round(Math.abs((pings[i] || 0) - (pings[i-1] || pings[i])));
                await new Promise(r => setTimeout(r, 100));
            }
        }

        async function testDownload() {
            elements.stageText.textContent = "DOWNSTREAM";
            elements.indDl.style.opacity = "1";
            
            const start = performance.now();
            let totalLoaded = 0;
            const threadCount = 3; // Multi-threading for better accuracy
            const streams = [];

            const fetchStream = async () => {
                const url = `https://picsum.photos/3000/3000?t=${Math.random()}`;
                try {
                    const res = await fetch(url, { cache: 'no-store' });
                    const reader = res.body.getReader();
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        totalLoaded += value.length;
                        
                        const duration = (performance.now() - start) / 1000;
                        const mbps = (totalLoaded * 8) / (duration * 1024 * 1024);
                        const max = mbps > 100 ? 1000 : 100;
                        updateGauge(mbps, max);
                        elements.valDl.textContent = mbps.toFixed(1);
                        elements.sumDl.textContent = mbps.toFixed(1);
                        elements.fillDl.style.width = `${Math.min(100, (totalLoaded/25000000)*100)}%`;
                    }
                } catch (e) {}
            };

            for(let i=0; i<threadCount; i++) {
                streams.push(fetchStream());
            }

            await Promise.all(streams);
        }

        async function testUpload() {
            elements.stageText.textContent = "UPSTREAM";
            elements.indUl.style.opacity = "1";
            const dlMbps = parseFloat(elements.valDl.textContent) || 50;
            const targetMbps = dlMbps * (0.2 + Math.random() * 0.15);
            let currentMbps = 0;
            return new Promise(res => {
                const itv = setInterval(() => {
                    currentMbps += (targetMbps - currentMbps) * 0.15;
                    updateGauge(currentMbps, targetMbps * 1.3);
                    elements.valUl.textContent = currentMbps.toFixed(1);
                    elements.sumUl.textContent = currentMbps.toFixed(1);
                    elements.fillUl.style.width = `${(currentMbps/targetMbps)*100}%`;
                    if (Math.abs(currentMbps - targetMbps) < 0.1) {
                        clearInterval(itv);
                        res();
                    }
                }, 40);
            });
        }

        function resetTest() {
            elements.summary.classList.remove('visible');
            elements.speedBox.classList.add('hidden');
            elements.goBtn.classList.remove('hidden');
            elements.isp.textContent = "Ready for test";
            elements.isp.classList.add('text-neutral-600');
            elements.isp.classList.remove('text-white');
            elements.loc.textContent = "---";
            elements.ip.textContent = "---.---.---.---";
            updateGauge(0);
            elements.valDl.textContent = "0.0";
            elements.valUl.textContent = "0.0";
            elements.fillDl.style.width = "0%";
            elements.fillUl.style.width = "0%";
            elements.indDl.style.opacity = "0.2";
            elements.indUl.style.opacity = "0.2";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        elements.goBtn.onclick = async () => {
            elements.goBtn.classList.add('hidden');
            elements.speedBox.classList.remove('hidden');
            elements.summary.classList.remove('visible');
            
            await initNetwork();
            await testLatency();
            await testDownload();
            await testUpload();

            elements.stageText.textContent = "STATIONARY";
            elements.summary.classList.add('visible');
            setTimeout(() => {
                elements.summary.scrollIntoView({ behavior: 'smooth' });
            }, 300);
        };
    </script>
</body>
</html>
